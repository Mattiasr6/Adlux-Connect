{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Login" %} - Adlux-Connect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-body">
        <h1 class="card-title h4">Apollo Hospital Chatbot</h1>
        <p class="text-muted">{% trans "Login" %}</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="username">{% trans "Username" %}</label>
            <input class="form-control" type="text" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">{% trans "Password" %}</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">{% trans "Login" %}</button>
        </form>
        <p class="mt-3 mb-0">{% trans "No account?" %} <a href="{% url 'signup' %}">{% trans "Signup" %}</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
