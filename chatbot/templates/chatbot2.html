{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'chat.css' %}">{% endblock %}
{% block title %}{% trans "Chat" %} - Adlux-Connect{% endblock %}
{% block content %}
{% csrf_token %}
<div class="row">
  <!-- Sidebar: misma estructura y clases que usa el JS (.sidebar, .menu, .toggle-btn) -->
  <section class="sidebar-section col-md-3">
    <div class="sidebar">
      <button class="toggle-btn btn btn-sm btn-outline-secondary" onclick="toggleSidebar()">⮜</button>
      <ul class="menu fixed list-unstyled">
        <li><a href="{% url 'logout' %}">{% trans "Logout" %}</a></li>
      </ul>
      <button id="new-chat-btn" class="btn btn-success btn-sm w-100 my-2">{% trans "+ New chat" %}</button>
      <ul class="menu dynamic list-group"></ul>
    </div>
  </section>

  <!-- Columna de chat -->
  <div class="col-md-9 d-flex flex-column chat-col">
    <div class="chat-container flex-grow-1 overflow-auto border rounded p-3 mb-3"></div>

    <div class="typing-container">
      <div class="input-group">
        <textarea id="chat-input" class="form-control" placeholder="{% trans "Enter a prompt here" %}" rows="1" required></textarea>
        <button id="send-btn" class="btn btn-primary" type="button">{% trans "Send" %} ➤</button>
      </div>
      <div class="mt-2">
        <button id="delete-btn" class="btn btn-sm btn-outline-danger" type="button">🗑 {% trans "Clear view" %}</button>
      </div>
    </div>
  </div>
</div>

<script>
    const chatInput = document.querySelector("#chat-input");
    const sendButton = document.querySelector("#send-btn");
    const chatContainer = document.querySelector(".chat-container");
    const deleteButton = document.querySelector("#delete-btn");
    const newChatButton = document.querySelector("#new-chat-btn");
    const initialInputHeight = chatInput.scrollHeight;
    var interactionList = JSON.parse('{{ interactions|escapejs }}');

    let userText = null;

    const defaultText = `<div class="default-text text-center py-5">
                            <h1>Apollo Adlux Chatbot</h1>
                            <p class="lead">{% blocktrans %}Hy {{user}} What can I help with?{% endblocktrans %}</p>
                        </div>`;

    newChatButton.addEventListener("click", function() {
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        fetch("new_chat", {
            method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrftoken,  // Send CSRF token
                },
                body: JSON.stringify({}) // Optional data, if needed in request body
        })
        .then(response => response.json())
        .then(data => {
            location.reload();  // Reloads the page
        })
        .catch(error => {
            console.error("Error fetching data:", error);
        });
    });

    function handleMenuItemClick(dataItem) {
        fetch('get_chat_history', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken(), // Add CSRF token for security
            },
            body: JSON.stringify({ data: dataItem }) // Pass the clicked data to the backend
        })
        .then(response => response.json())
        .then(data => {
            if (data.redirect_url) {
                window.location.href = data.redirect_url; // Navigate to the new view
            } else if (data.status === 'success') {
                if (data.interactions) {
                    chatContainer.innerHTML ='';
                    interactions = JSON.parse(data.interactions)
                    interactions.forEach(interaction => {
                        const html = `<div class="d-flex justify-content-end mb-2">
                                        <div class="card bg-primary text-white" style="max-width: 85%;">
                                          <div class="card-body py-2 px-3"><p class="mb-0">${interaction.user_message}</p></div>
                                        </div>
                                      </div>`;
                        const outgoingChatDiv = createChatElement(html, "outgoing");
                        chatContainer.querySelector(".default-text")?.remove();
                        chatContainer.appendChild(outgoingChatDiv);
                        chatContainer.scrollTo(0, chatContainer.scrollHeight);
                        showBotResponse(interaction.bot_response, interaction.interaction_id, interaction.feedback, null)
                    });
                } else {
                    console.error("No interactions found.");
                }
            } else {
                console.error("Action failed:", data.message);
            }
        })
        .catch(error => console.error("Error handling menu item click:", error));
    }

    function updateSidebarMenu(dummyData) {
        const sidebarMenu = document.querySelector('.sidebar .menu.dynamic');

        // Ensure sidebar items are cleared and updated with fetched data
        sidebarMenu.innerHTML = '';  // Clear existing menu items

        // Populate the sidebar with the fetched dummy data
        dummyData.forEach(item => {
            const listItem = document.createElement('li');
            const anchor = document.createElement('a');
            anchor.href = '#';
            anchor.textContent = item;  // Set text to each data item
            anchor.classList.add('list-group-item', 'list-group-item-action', 'text-truncate');
            listItem.appendChild(anchor);
            sidebarMenu.appendChild(listItem);

            anchor.addEventListener('click', (e) => {
                e.preventDefault(); // No ensuciar la URL con #
                handleMenuItemClick(item); // Send item to the backend when clicked
        });
        });
    }

    function fetchSidebarData() {
        // Use a GET request to fetch data when the sidebar is open
        fetch('fetch_sidebar_data', {
            method: 'GET',  // Use GET for fetching dummy data
            headers: {
                'X-CSRFToken': getCSRFToken(),  // Add CSRF token for security
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.dummyData) {
                updateSidebarMenu(data.dummyData);
            } else {
                console.error("No data received");
            }
        })
        .catch(error => console.error("Error fetching data: ", error));
    }

    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.querySelector('.toggle-btn');

        sidebar.classList.toggle('collapsed');  // Toggling the sidebar class

        // Update the toggle button arrow direction
        if (sidebar.classList.contains('collapsed')) {
            toggleBtn.innerHTML = '⮞'; // Point right when closed
        } else {
            toggleBtn.innerHTML = '⮜'; // Point left when open

            // Fetch data when the sidebar is opened
            fetchSidebarData();
        }

        // Ensure the sidebar items are hidden when collapsed
        const sidebarMenu = sidebar.querySelector('.menu');
        sidebarMenu.style.display = sidebar.classList.contains('collapsed') ? 'none' : 'block';
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Check the initial state of the sidebar on page load
        const sidebar = document.querySelector('.sidebar');
        const sidebarMenu = sidebar.querySelector('.menu');

        // If sidebar is already open, fetch and display data
        if (!sidebar.classList.contains('collapsed')) {
            fetchSidebarData();
        } else {
            sidebarMenu.style.display = 'none';  // Hide the menu items when collapsed
        }
    });

    const loadDefaultView = () => {
        chatContainer.innerHTML = defaultText;
        chatContainer.scrollTo(0, chatContainer.scrollHeight);
    };

    function getCSRFToken() {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith('csrftoken=')) {
                return cookie.substring('csrftoken='.length, cookie.length);
            }
        }
        return '';
    }

    const createChatElement = (content, ...classNames) => {
        // Create new div and apply multiple class names by spreading classNames
        const chatDiv = document.createElement("div");
        chatDiv.classList.add("chat", ...classNames); // Spread classNames into individual tokens
        chatDiv.innerHTML = content;
        return chatDiv; // Return the created chat div
    };

    const copyResponse = (copyBtn) => {
        // Copy the text content of the response to the clipboard
        const responseTextElement = copyBtn.parentElement.querySelector("p");
        navigator.clipboard.writeText(responseTextElement.textContent);
        copyBtn.textContent = "✓ {% trans "copied" %}";
        setTimeout(() => copyBtn.textContent = "{% trans "copy" %}", 1000);
    };

    const showBotResponse = (responseText, interactionId, feedback, fuente) => {
        const fid = interactionId || '';
        const html = `<div class="d-flex mb-2">
                        <span class="fs-4 me-2">🤖</span>
                        <div class="card flex-grow-1">
                          <div class="card-body py-2 px-3">
                            <p class="mb-0">${responseText}</p>
                            <button class="btn btn-sm btn-link p-0" onclick="copyResponse(this)">{% trans "copy" %}</button>
                            ${fuente ? `<div><span class="badge text-bg-secondary" title="{% trans "Document backing this answer" %}">{% trans "Source:" %} ${fuente}</span></div>` : ''}
                            <div class="btn-group btn-group-sm ms-2" role="group" aria-label="{% trans "Rate this answer" %}" data-feedback-group="${fid}">
                              <button type="button" class="btn btn-outline-secondary" data-voto="1" title="{% trans "Bad" %}" onclick="votar('${fid}', 1)">1</button>
                              <button type="button" class="btn btn-outline-secondary" data-voto="2" title="{% trans "Regular" %}" onclick="votar('${fid}', 2)">2</button>
                              <button type="button" class="btn btn-outline-secondary" data-voto="3" title="{% trans "Good" %}" onclick="votar('${fid}', 3)">3</button>
                              <button type="button" class="btn btn-outline-secondary" data-voto="4" title="{% trans "Excellent" %}" onclick="votar('${fid}', 4)">4</button>
                            </div>
                          </div>
                        </div>
                      </div>`;
        const botResponseDiv = createChatElement(html, "incoming");
        chatContainer.appendChild(botResponseDiv);
        chatContainer.scrollTo(0, chatContainer.scrollHeight);
        if (fid) paintFeedback(fid, feedback || 0);
    };

    const votar = (interactionId, valor) => {
        if (!interactionId) return;
        fetch('submit_feedback', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
            },
            body: JSON.stringify({interaction_id: interactionId, feedback: valor})
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') paintFeedback(interactionId, valor);
        })
        .catch(error => console.error('Error:', error));
    };

    const paintFeedback = (interactionId, valor) => {
        const grupo = document.querySelector(`[data-feedback-group="${interactionId}"]`);
        if (!grupo) return;
        grupo.querySelectorAll('button').forEach(b => {
            const activo = parseInt(b.dataset.voto, 10) === valor;
            b.classList.toggle('btn-primary', activo);
            b.classList.toggle('btn-outline-secondary', !activo);
        });
    };

    const showTypingAnimation = () => {
        // Display the typing animation while waiting for the server
        const html = `<div class="d-flex mb-2">
                        <span class="fs-4 me-2">🤖</span>
                        <div class="card flex-grow-1">
                          <div class="card-body py-2 px-3">
                            <div class="typing-animation">
                                <div class="typing-dot" style="--delay: 0.2s"></div>
                                <div class="typing-dot" style="--delay: 0.3s"></div>
                                <div class="typing-dot" style="--delay: 0.4s"></div>
                            </div>
                          </div>
                        </div>
                      </div>`;
        const incomingChatDiv = createChatElement(html, "incoming", "typing");
        chatContainer.appendChild(incomingChatDiv);
        chatContainer.scrollTo(0, chatContainer.scrollHeight);
    };

    const handleOutgoingChat = () => {
        userText = chatInput.value.trim();
        if (!userText) return;

        const html = `<div class="d-flex justify-content-end mb-2">
                        <div class="card bg-primary text-white" style="max-width: 85%;">
                          <div class="card-body py-2 px-3">
                            <p class="mb-0">${userText}</p>
                          </div>
                        </div>
                      </div>`;
        const outgoingChatDiv = createChatElement(html, "outgoing");
        chatContainer.querySelector(".default-text")?.remove();
        chatContainer.appendChild(outgoingChatDiv);
        chatContainer.scrollTo(0, chatContainer.scrollHeight);

        chatInput.value = "";
        chatInput.style.height = `${initialInputHeight}px`;

        showTypingAnimation();

        sendMessage(userText);
    };

    const sendMessage = (message) => {
        // Simulate typing animation by removing it after some time
        const typingDiv = document.querySelector(".typing");

        fetch('/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken() // Adding CSRF token from cookies
            },
            body: JSON.stringify({ message })
        })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                // Remove typing animation
                typingDiv?.remove();

                // Show the bot's response
                showBotResponse(data.response, data.interaction_id, null, data.fuente || null);
            })
            .catch(error => {
                typingDiv?.remove();
                console.error('Error:', error);
                showBotResponse("{% trans "Sorry, something went wrong. Please try again." %}", null, null, null);
            });
    };

    deleteButton.addEventListener("click", () => {
        // Limpia solo la vista local (el historial del servidor se conserva).
        if (confirm("{% trans "Clear the current view? Saved history is kept." %}")) {
            loadDefaultView();
        }
    });

    chatInput.addEventListener("input", () => {
        chatInput.style.height = `${initialInputHeight}px`;
        chatInput.style.height = `${chatInput.scrollHeight}px`;
    });

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 800) {
            e.preventDefault();
            handleOutgoingChat();
        }
    });

    // Render inicial: historial del servidor o vista por defecto.
    // (Registro único del envío: antes se registraba una vez por cada
    // mensaje del historial, duplicando los POST.)
    if (interactionList.length > 0) {
        interactionList.forEach(interaction => {
            const html = `<div class="d-flex justify-content-end mb-2">
                            <div class="card bg-primary text-white" style="max-width: 85%;">
                              <div class="card-body py-2 px-3"><p class="mb-0">${interaction.user_message}</p></div>
                            </div>
                          </div>`;
            const outgoingChatDiv = createChatElement(html, "outgoing");
            chatContainer.querySelector(".default-text")?.remove();
            chatContainer.appendChild(outgoingChatDiv);
            chatContainer.scrollTo(0, chatContainer.scrollHeight);
            showBotResponse(interaction.bot_response, interaction.interaction_id, interaction.feedback, null)
        });
    } else {
        loadDefaultView();
    }
    sendButton.addEventListener("click", handleOutgoingChat);
</script>
{% endblock %}
